
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZARA - Página Oficial</title>
    <style>
        body {
            background-color: #ffffff;
            color: #000000;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        header {
            padding: 20px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eeeeee;
        }
        .logo {
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 6px;
        }
        nav a {
            color: #000000;
            text-decoration: none;
            margin-left: 20px;
            font-size: 11px;
            font-weight: 600;
        }
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 40px 20px;
        }
        h1 {
            font-size: 14px;
            font-weight: 400;
            letter-spacing: 3px;
            margin-bottom: 10px;
        }
        h2 {
            font-size: 20px;
            font-weight: 600;
            letter-spacing: 4px;
            margin: 20px 0;
        }
        p {
            font-size: 11px;
            color: #666666;
            letter-spacing: 2px;
            margin-bottom: 20px;
        }
        /* Contenedor para hacer el vídeo responsivo */
        .video-container {
            position: relative;
            width: 100%;
            max-width: 640px;
            aspect-ratio: 16 / 9;
            margin-top: 10px;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }
        footer {
            padding: 20px;
            text-align: center;
            font-size: 9px;
            color: #999999;
            letter-spacing: 2px;
            border-top: 1px solid #eeeeee;
        }
    </style>
</head>
<body>
    <header>
        <div class="logo">ZARA</div>
        <nav>
            <a href="#">SHOP</a>
            <a href="#">INFO</a>
        </nav>
    </header>

    <main>
        <h1>¡Hola, mundo!</h1>
        <p>Este es el contenido visible de la página.</p>
        <h2>María del Rocío Pérez García</h2>
        
        <!-- Vídeo incrustado -->
        <div class="video-container">
            <iframe src="https://www.youtube.com/embed/HOegM6iv1bo" title="YouTube video player" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
        </div>
    </main>

    <footer>
        &copy; 2026 ZARA
    </footer>
</body>
</html>
